<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand favicon: the wordmark reduced to one glyph. Ink tile, orange "S",
       the site's own two colours (#17150F ink, #FF5A1E orange). Replaces the
       off-brand purple bolt that shipped with the template. -->
  <rect width="64" height="64" rx="15" fill="#17150F"/>
  <text x="32.5" y="46"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="44"
        letter-spacing="-1"
        fill="#FF5A1E">S</text>
</svg>
